services:
  web:
    build: .
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3310:3310"
      - "3000:3000"
    environment:
      NODE_ENV: development
      APP_PORT: 3310
      APP_SECRET: "development-only-secret-at-least-32-characters"
      CLIENT_URL: "http://localhost:3000"
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: lucarne
      VITE_API_URL: "http://localhost:3310"
    command: sh -c "npm run dev"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql/mysql-server:8.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./database-setup.sh:/docker-entrypoint-initdb.d/setup.sh
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - target: 3306
        published: 3307
        protocol: tcp
