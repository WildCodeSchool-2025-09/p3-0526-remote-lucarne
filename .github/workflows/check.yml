name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - dev
      - main

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest

    services:
      db_test:
        image: postgres:17
        env:
          POSTGRES_DB: lucarne_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d lucarne_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    permissions:
      checks: write
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/lucarne

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/lucarne

      - name: Run checks
        run: npm run check

      - name: Build applications
        run: npm run build

      - name: Run test web
        run: npm run test:web

      - name: Run API tests
        run: npm run test:api

      - name: Migrate test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5436/lucarne_test

      - name: Run API integration tests
        run: npm run test:api:integration
        env:
          APP_SECRET: test-secret-with-at-least-32-characters
          DATABASE_URL: postgresql://user:password@localhost:5435/lucarne
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5436/lucarne_test
