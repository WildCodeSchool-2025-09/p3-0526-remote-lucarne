name: CI

on:
  pull_request:
    branches: [develop, dev, main, staging]
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ github.sha }})
    runs-on: ubuntu-24.04
    services:
      db_test:
        image: postgres:17
        env:
          POSTGRES_DB: lucarne_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d lucarne_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_SECRET: test-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://user:password@localhost:5435/lucarne
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5436/lucarne_test
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v6.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Validate Prisma schema and migration state
        run: |
          npm run prisma:validate
          npm exec --workspace=@lucarne/api -- prisma migrate deploy
          npm exec --workspace=@lucarne/api -- prisma migrate status
          npm exec --workspace=@lucarne/api -- prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5436/lucarne_test
      - name: Validate source quality
        run: |
          npm run lint
          npm run check-types
      - name: Run shared tests
        run: npm run test --workspace=@lucarne/shared
      - name: Run API tests
        run: npm run test:api
      - name: Run web tests
        run: npm run test:web
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Build API and web artifacts
        run: npm run build
      - name: Check repository whitespace
        run: git diff --check
